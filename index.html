
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop Mẹ CaCao - Tole xinh cho bé yêu!</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo-area">
            <img src="images/Logo.jpg" alt="Shop Mẹ CaCao">
            
            <div>
                <h1>Shop Mẹ CaCao</h1>
                <p>Tole xinh cho bé yêu!</p>
                <small>Since 2023</small>
            </div>
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 <span id="cart-count">0</span>
        </button>

    </header>


    <!-- BANNER -->
    <section class="hero">

        <div class="hero-content">

            <p class="small-title">THỜI TRANG BÉ YÊU</p>

            <h2>
                Tole xinh<br>
                cho bé yêu!
            </h2>

            <p>
                Những bộ đồ nhỏ xinh được mẹ chọn
                bằng cả yêu thương.
            </p>

            <button onclick="scrollToProducts()">
                Xem sản phẩm
            </button>

        </div>

    </section>


    <!-- DANH MỤC -->
    <section class="categories">

        <h2>Danh mục sản phẩm</h2>

        <div class="category-list">

            <button onclick="filterProducts('all')">
                🌸 Tất cả
            </button>

            <button onclick="filterProducts('girl')">
                👧 Bé gái
            </button>

            <button onclick="filterProducts('boy')">
                👦 Bé trai
            </button>

        </div>

    </section>


    <!-- PRODUCTS -->
    <main id="products" class="products-section">

        <div class="section-title">

            <div>
                <h2>Sản phẩm mới</h2>
                <p>Những mẫu xinh xắn dành cho bé</p>
            </div>

        </div>

        <div id="product-list" class="product-grid">

            <!-- SẢN PHẨM SẼ ĐƯỢC JAVASCRIPT HIỂN THỊ Ở ĐÂY -->

        </div>

    </main>


    <!-- CART -->
    <div id="cart-modal" class="cart-modal">

        <div class="cart-box">

            <div class="cart-header">

                <h2>🛒 Giỏ hàng</h2>

                <button onclick="closeCart()">✕</button>

            </div>

            <div id="cart-items"></div>

            <div class="cart-total">

                <span>Tổng cộng</span>

                <strong id="cart-total">0đ</strong>

            </div>

            <button class="checkout-button" onclick="checkout()">
                Đặt hàng
            </button>

        </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button onclick="window.scrollTo({top:0, behavior:'smooth'})">
            🏠
            <span>Trang chủ</span>
        </button>

        <button onclick="scrollToProducts()">
            🛍️
            <span>Sản phẩm</span>
        </button>

        <button onclick="openCart()">
            🛒
            <span>Giỏ hàng</span>
        </button>

        <button onclick="contactShop()">
            💬
            <span>Liên hệ</span>
        </button>

    </nav>


    <script src="script.js"></script>

</body>
</html>
